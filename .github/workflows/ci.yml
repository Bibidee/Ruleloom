name: Ruleloom CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: package-lock.json}
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt
      # gltest 0.29.2 still requests the retired universal archive filename.
      # rc7 publishes the identical runner bundle as genvm-runners-all.
      - run: mkdir -p ~/.cache/gltest-direct && curl -fsSL --retry 3 https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz -o ~/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz
      - run: python -m py_compile contracts/ruleloom_book.py contracts/ruleloom_pass.py
      - run: python -m pytest tests/contract
      - run: genvm-lint lint contracts/ruleloom_book.py && genvm-lint lint contracts/ruleloom_pass.py
      - run: genvm-lint validate contracts/ruleloom_book.py && genvm-lint validate contracts/ruleloom_pass.py
      - run: mkdir -p artifacts && genvm-lint schema contracts/ruleloom_book.py -o artifacts/ruleloom_book.schema.json && genvm-lint schema contracts/ruleloom_pass.py -o artifacts/ruleloom_pass.schema.json
  live-studionet:
    if: ${{ vars.RUN_LIVE_STUDIONET == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Live deployment is opt-in; provide a funded signer only through protected environment configuration.'
